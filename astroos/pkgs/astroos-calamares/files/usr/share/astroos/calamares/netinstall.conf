---
# AstroOS: the package groups come from the local file only. Upstream lists a
# raw.githubusercontent.com URL first, which would let the installed package
# set change after the ISO ships; AstroOS installs exactly what was audited.
groupsUrl:
 - file:///etc/calamares/modules/netinstall.yaml
required: true
label:
 sidebar: "Packages"
 title: "Additional packages"
