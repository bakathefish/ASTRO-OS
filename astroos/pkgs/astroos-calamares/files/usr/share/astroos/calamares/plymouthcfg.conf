---
# AstroOS: the astroos boot splash, on every GPU. The theme is astroos-theme's
# /usr/share/plymouth/themes/astroos: plymouth's two-step module, the palette's
# space gradient, the spinner frames plymouth already ships and the AstroOS
# watermark. Replaces the CachyOS theme packages upstream selects here, which
# an AstroOS system does not install.
#
# Both keys, and both the same: the amdgpu key overrides the other when an AMD
# card is found, and there is nothing about our splash that wants a second
# variant. Naming a theme that is not installed leaves plymouth configured for
# a missing theme, so astroos-theme is in the pacstrap base package list beside
# plymouth (apply.sh, section 4).
plymouth_theme: astroos
plymouth_theme_amdgpu: astroos
