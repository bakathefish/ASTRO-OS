# AstroOS login-screen wallpaper for Plasma Login Manager (plasmalogin), the
# same image as the desktop and the SDDM greeter. Vendor drop-in: the System
# Settings login page writes /etc/plasmalogin.conf, which overrides this file.
[Greeter]
WallpaperPluginId=org.kde.image

[Greeter][Wallpaper][org.kde.image][General]
Image=/usr/share/wallpapers/AstroOS/contents/images/3840x2160.png
