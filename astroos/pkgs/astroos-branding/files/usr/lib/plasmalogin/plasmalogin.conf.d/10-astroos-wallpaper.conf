# AstroOS login-screen wallpaper for Plasma Login Manager (plasmalogin), the
# same image as the SDDM greeter. It is not the desktop wallpaper: both
# greeters stack the clock, the avatar and the password field down the middle
# of the screen, and the desktop wallpaper puts the planet exactly there, so
# it showed as a coloured smudge behind the avatar. login-background.png moves
# the planet low and right of that column. Vendor drop-in: the System Settings
# login page writes /etc/plasmalogin.conf, which overrides this file.
[Greeter]
WallpaperPluginId=org.kde.image

[Greeter][Wallpaper][org.kde.image][General]
Image=/usr/share/astroos/branding/login-background.png
