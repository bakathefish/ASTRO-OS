# astroos-branding ships the greeter account's kdeglobals and plasmarc under
# /var/lib/sddm/.config (the login screen's colour scheme and Plasma theme).
# pacman creates that directory root-owned, and the greeter, which runs as the
# sddm account, could then not write its own sddm-greeter-qt6rc and
# plasma-keyboardrc beside them: the first thing a freshly installed system
# showed was a full-screen "Configuration file ... not writable. Please contact
# your system administrator." box, twice, before the login form (2026-09-06
# E2E). sddm-kcm's own helper leaves the directory owned by the greeter; this
# rule does the same, at package install through the systemd tmpfiles pacman
# hook and again at every boot by systemd-tmpfiles-setup.
#
# plasmalogin (plasma-login-manager) gets the same treatment from the package's
# install script behind a getent guard: a tmpfiles line for an account that
# does not exist would fail systemd-tmpfiles-setup at every boot.
Z /var/lib/sddm/.config - sddm sddm - -
